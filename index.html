<!-- Every path on this page is relative. The site is served from the subpath
     /voyage-tce-model/, never from a domain root, so a leading slash breaks the
     deploy. tools/check-paths.mjs fails on one, and scripts/serve.py reproduces
     the subpath locally. -->

<!-- An empty data URI, so the browser does not ask the origin root for a
     favicon, which on a project page is somebody else's file. -->
<link rel="icon" href="data:,">

<!-- The theme, set before the first paint. It reads the key nc-theme, which
     the portfolio shares because both sites live on the same origin. A blocked
     store falls back to light, the value the html element ships with.
     src/theme.js owns the toggle after load. -->
<script>
  (function () {
    try {
      if (localStorage.getItem("nc-theme") === "dark") {
        document.documentElement.setAttribute("data-theme", "dark");
        var meta = document.querySelector('meta[name="theme-color"]');
        if (meta) meta.setAttribute("content", "#17181C");
      }
    } catch (error) {
      /* storage blocked: stay light */
    }
  })();
</script>

     must come before the first module script. -->

<!-- If a module cannot load or run before src/ui.js marks the page started,
     say so instead of loading for ever. A failed module fires an error on the
     window, caught here in the capture phase. -->
<script>
  window.addEventListener("error", function () {
    if (document.documentElement.hasAttribute("data-started")) return;
    var view = document.getElementById("view");
    if (!view) return;
    var said = document.createElement("p");
    said.className = "state-message";
    said.setAttribute("role", "alert");
    said.textContent = "The page's code could not load or run, so nothing can be drawn. Reload the page; if it fails again, the figures are still readable as text in data/overview.json.";
    view.replaceChildren(said);
  }, true);
</script>
