[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "voyage-tce-model"
version = "0.1.0"
description = "Voyage economics and time charter equivalent for dry bulk and tanker routes: Worldscale, bunkers by sulphur zone, ports, canals, war risk, EU ETS and the ballast leg, set against the FFA curve"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Nathan Couturier" }]
# Direct dependencies are pinned to the exact versions the tests and the
# committed artifacts were produced with. requirements-lock.txt pins the whole
# tree, and the workflows install from it.
dependencies = [
  "requests==2.34.2",
  "beautifulsoup4==4.15.0",
  "lxml==6.1.3",
  "pdfplumber==0.11.10",
  "matplotlib==3.11.2",
  "reportlab==5.0.1",
]

[project.optional-dependencies]
dev = ["pytest==9.1.1", "ruff==0.17.0"]
# searoute computes the sea routes once; the seed it writes is committed, so
# neither the pipeline nor the site needs it. scripts/routes.py checks the version.
routes = ["searoute==1.6.0"]

[project.urls]
Homepage = "https://nathancouturier.github.io/voyage-tce-model/"
Source = "https://github.com/nathancouturier/voyage-tce-model"

[tool.setuptools]
package-dir = { "" = "src" }

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-q"

[tool.ruff]
line-length = 120
target-version = "py311"
src = ["src", "tests", "scripts"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "N", "SIM", "RUF"]
ignore = ["RUF001", "RUF002", "RUF003", "UP031"]

[tool.ruff.format]
quote-style = "double"
